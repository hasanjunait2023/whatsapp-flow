[databases]
# Map logical db name to physical Postgres. Use the SCRAM-authenticated host db.
# PgBouncer reaches Postgres over the internal compose network as `postgres:5432`
# — same hostname the app container uses today, just pooled through us now.
whatsapp_flow = host=postgres port=5432 dbname=whatsapp_flow

[peers]
# No peers needed in single-PgBouncer setup. Multi-host sharding can add here.

[pgbouncer]
# === Where PgBouncer listens ===
listen_addr = 0.0.0.0
listen_port = 6432

# === Where clients connect from ===
# Any container on wf_net can reach us at `pgbouncer:6432`. We don't expose a
# host port — the app talks to us over the docker network.
#
# Auth: clients send SCRAM-SHA-256 password. PgBouncer validates locally against
# the userlist.txt file (SCRAM hash from pg_shadow). After validation, PgBouncer
# opens the upstream conn WITHOUT a password — Postgres' pg_hba.conf has a
# trust rule for wf_user from the docker bridge subnet (172.21.0.0/16) so the
# pool server-side conn is fully trust-validated. This sidesteps SCRAM
# upstream-handshake quirks in our pgbouncer image while keeping client-side
# SCRAM enforcement.
#
# To rotate: ALTER USER wf_user WITH PASSWORD '...' on Postgres, re-export new
# SCRAM hash from pg_shadow into userlist.txt, docker compose restart pgbouncer.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
# Don't pass password upstream — pg_hba.conf trusts wf_user from 172.21.0.0/16.
# PgBouncer uses pool_mode=transaction, so it opens a server conn, runs queries,
# and the conn stays idle until grabbed by the next request. The SCRAM hash from
# userlist.txt authenticates the client; the trust rule authenticates the server.
client_login_timeout = 15

# === Pool sizing ===
# The upstream Postgres (max_connections=100) currently shares with restic-backup
# and a few admin sessions. Keep pool_size + reserve_pool comfortably under that.
pool_mode = transaction
max_client_conn = 4000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
# server_idle_timeout — recycle long-idle upstream conns to free server resources.
server_idle_timeout = 600
# query_timeout — defense against runaway queries; Hono endpoints are short-lived.
query_timeout = 30
# client_idle_timeout — close connections that abandoned the pool.
client_idle_timeout = 0
# ignore_startup_parameters — Hono's pg client passes these which are useless
# inside a pooler but harmless to forward; stays explicit for future hardening.
ignore_startup_parameters = extra_float_digits,options,search_path,application_name

# === Auth delegation to Postgres ===
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_user = wf_user

# === Admin ===
# Disable admin endpoints on the listen port — we don't need remote admin.
admin_users =
stats_users =
# Enable the unix socket for host-side debug (`psql -h /var/run/pgbouncer`).
unix_socket_dir = /var/run/pgbouncer

# === Logging ===
# Verbose logging is fine here; PgBouncer's log volume is tiny compared to app logs.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
# Default stats period (seconds) — Grafana scrapes STATS every 15s by design.
stats_period = 60
