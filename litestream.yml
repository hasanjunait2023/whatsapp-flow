# ===========================================================================
# Litestream — continuous SQLite WAL replication to Cloudflare R2.
#
# R2 is S3-compatible. Credentials + bucket come from the environment
# (.env.production, injected into the litestream container). NEVER hardcode
# keys here. Litestream reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from
# the env; the bucket/endpoint are templated from R2_* vars below.
#
# Restore (disaster recovery), run on the host with the same env:
#   litestream restore -config litestream.yml /data/sqlite/app.db
# ===========================================================================

# Litestream needs the access keys under AWS_* names — set in .env.production:
#   AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
#   AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
# (the compose env_file passes them through to this container).

dbs:
  - path: /data/sqlite/app.db
    replicas:
      - type: s3
        # Cloudflare R2 S3 endpoint, e.g. https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        endpoint: ${R2_ENDPOINT}
        bucket: ${R2_BUCKET}
        # Object-key prefix inside the bucket for this DB's replica.
        path: whatsapp-flow/sqlite
        # R2 ignores region but the S3 client requires one; "auto" is correct.
        region: auto
        # R2 does not support the legacy path-vs-vhost toggles the same way;
        # force-path-style keeps the client compatible with R2's endpoint.
        force-path-style: true
        # Keep generations bounded; tune retention as needed.
        retention: 72h
        snapshot-interval: 1h
