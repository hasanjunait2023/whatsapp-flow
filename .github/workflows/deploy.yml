name: Build & Deploy to Hostinger (SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Upload dist to server (temp folder)
      - name: Upload dist to temp folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/"
          target: "domains/myecomex.com/deploy_tmp"

      # Replace whataapp folder content with new build
      - name: Replace whataapp content
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf domains/myecomex.com/public_html/whataapp/*
            cp -r domains/myecomex.com/deploy_tmp/dist/* domains/myecomex.com/public_html/whateapp/
            rm -rf domains/myecomex.com/deploy_tmp
