# ===========================================================================
# whatsapp-flow — nginx reverse-proxy vhost (host nginx, systemd)
#
# Mirrors the existing Cloudflare-proxied vhost pattern on the box: listen on
# port 80 only, plain HTTP at the origin; TLS terminates at Cloudflare's edge
# (orange-cloud, SSL mode "Full"). DO NOT add a `listen 443` block unless you
# switch this host to an origin cert.
#
# INSTALL (additive — does not touch any existing vhost):
#   1. Set CLOUDFLARE DNS: an A/AAAA (or proxied CNAME) for <APP_HOSTNAME>
#      pointing at the VPS, orange-cloud ON. SSL/TLS mode = Full.
#   2. sudo cp deploy/nginx/app.conf /etc/nginx/sites-available/<APP_HOSTNAME>
#      (replace <APP_HOSTNAME> below with the real hostname first)
#   3. sudo ln -s /etc/nginx/sites-available/<APP_HOSTNAME> \
#                 /etc/nginx/sites-enabled/<APP_HOSTNAME>
#   4. sudo nginx -t && sudo systemctl reload nginx   # reload, NOT restart
#
# ROLLBACK:
#   sudo rm /etc/nginx/sites-enabled/<APP_HOSTNAME>
#   sudo nginx -t && sudo systemctl reload nginx
# ===========================================================================

# Upstream is the loopback-only app container (compose binds 127.0.0.1:3500).
# 3500 because host port 3000 is already taken (Phase 0).
upstream whatsapp_flow_app {
    server 127.0.0.1:3500;
    keepalive 32;
}

# WebSocket upgrade helper: maps the Upgrade request header to the right
# Connection header for the realtime /api/ws endpoint. http-context (valid here
# because sites-enabled is included inside the http block). Cloudflare passes
# WebSocket frames through automatically for proxied (orange-cloud) hostnames.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    # >>> REPLACE with the real hostname (e.g. app.junno.qzz.io) <<<
    server_name APP_HOSTNAME;

    # Allow large media uploads (tenant images/docs). Tune to your needs.
    client_max_body_size 50m;

    # -----------------------------------------------------------------------
    # Real client IP (security: the app's rate limiter trusts X-Real-IP).
    # Honor CF-Connecting-IP ONLY when the immediate peer is a genuine
    # Cloudflare edge; for any other peer (e.g. someone hitting the origin IP
    # directly to spoof a header) $remote_addr stays the real socket address.
    # nginx then overwrites X-Real-IP with that resolved value below, so the
    # app can trust it. Refresh ranges from https://www.cloudflare.com/ips/.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # Optional defense-in-depth (disabled to avoid an outage if CF rotates a
    # range): reject direct-to-origin traffic. real_ip above already prevents
    # the rate-limit spoof, so this is not required to close the finding.
    #   allow <same CF ranges>; deny all;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # -----------------------------------------------------------------------
    # SSE stream: the app holds ONE long-lived Server-Sent-Events connection
    # per browser tab (realtime route). Without these, nginx buffers and cuts
    # the stream. These four settings are MANDATORY (Phase 0 SSE caveat).
    # -----------------------------------------------------------------------
    location /api/realtime {
        proxy_pass http://whatsapp_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # keep upstream connection alive
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_buffering off;              # do not buffer the event stream
        proxy_cache off;                  # never cache SSE
        proxy_read_timeout 3600s;         # long-lived stream (1h)
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # -----------------------------------------------------------------------
    # WebSocket realtime: the app's PRIMARY realtime transport (/api/ws). The
    # Upgrade + Connection headers carry the handshake; long timeouts keep the
    # socket open. More specific than `location /api/`, so nginx matches it first.
    # -----------------------------------------------------------------------
    location /api/ws {
        proxy_pass http://whatsapp_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;   # long-lived socket (1h idle ceiling)
        proxy_send_timeout 3600s;
    }

    # API (auth, query, rpc, fn, media, webhooks). HTTP/1.1 + keepalive.
    # NOTE: nginx does NOT inherit server-level proxy_set_header into a location
    # that declares its own, so the forwarded headers are repeated here. X-Real-IP
    # ($remote_addr, resolved by real_ip above) is what the app's rate limiter
    # trusts — it MUST be set here, overwriting any client-supplied value.
    location /api/ {
        proxy_pass http://whatsapp_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # SPA + static assets, with SPA fallback handled by the server.
    location / {
        proxy_pass http://whatsapp_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hide dotfiles.
    location ~ /\. {
        deny all;
    }
}
