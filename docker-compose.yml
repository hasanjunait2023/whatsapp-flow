# ===========================================================================
# whatsapp-flow — production stack for the Contabo VPS (FRESH launch)
#
# HARD RULES (Phase 0 reality — see .claude/team/PHASE0-REPORT.md):
#   * Host nginx (systemd) owns 80/443. NEVER bind 80/443 here.
#   * Port 3000 is already taken on the host. The app exposes ONLY
#     127.0.0.1:3500 (loopback) — nginx reverse-proxies to it.
#   * WAHA has NO host port: the app reaches it over the compose network at
#     http://waha:3000. WAHA reaches the app's webhook at http://app:3500.
#   * DATABASE: Postgres lives in the EXISTING postiz-postgres container
#     (db `whatsapp_flow`, role `wf_user`). The app joins postiz's network to
#     reach it at host `postiz-postgres:5432`. Never touch postiz's own db.
#   * Everything additive — never touch postiz/cobalt/searxng or their volumes.
#   * mem_limits are mandatory; the box is RAM-tight (swap exhausted at Phase 0).
#
# Validate before deploy:  docker compose config
# ===========================================================================

name: whatsapp-flow

networks:
  wf_net:
    driver: bridge
  # The shared postiz network where postiz-postgres lives. Created by the postiz
  # stack; we attach to it read-only (additive — we never manage it).
  postiz_net:
    external: true
    name: postiz-app_postiz-network

volumes:
  media_data:     # /data/media   — tenant media (backed up by restic)
  waha_data:      # /data/waha    — WAHA Plus session persistence (backed up by restic)
  pg_backup:      # /backup       — nightly pg_dump output (backed up by restic to R2)
  prom_data:      # /prometheus   — Prometheus TSDB (15d retention)
  grafana_data:   # /var/lib/grafana — Grafana state (dashboards from provisioning, not from here)
  redis_data:     # /data         — whatsapp-flow Redis (Phase 2 Pub/Sub substrate; isolated from hybrid-redis)

services:
  # -------------------------------------------------------------------------
  # app — Hono server + bundled SPA. Loopback-only; nginx proxies to it.
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-flow:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Pin the runtime wiring here so it can't drift from the env file.
      # DATABASE_URL is a secret (carries the wf_user password) and comes from
      # .env.production, NOT pinned here.
      NODE_ENV: production
      PORT: "3500"
      MEDIA_DIR: /data/media
      WEB_DIST_DIR: /app/apps/web/dist
      # Phase 2 — cross-instance realtime bridge (redis-pubsub.ts). The bridge
      # silently degrades to single-instance mode if REDIS_URL is unset or
      # unreachable; we set it explicitly so behavior is obvious in logs.
      REDIS_URL: redis://redis:6379
      # Phase 5 — Redis-backed distributed job queue (redis-queue.ts).
      # Default-OFF so the proven Postgres queue stays the truth. Set to "true"
      # when scaling to 2+ app replicas. Decodes via initRedisQueue(); fails
      # silently to Postgres if Redis is unreachable.
      REDIS_JOBS_ENABLED: "false"
      # WAHA over the compose network (container-to-container, no host port).
      WAHA_URL: http://waha:3000
      # Plus mode: one session per tenant instance (session name == instance id).
      WAHA_SINGLE_SESSION: "false"
      # WAHA calls our webhook back over the network at the app service.
      WAHA_WEBHOOK_BASE_URL: http://app:3500
    ports:
      # Loopback only. 3500 chosen because 3000 is taken on the host (Phase 0).
      - "127.0.0.1:3500:3500"
    volumes:
      - media_data:/data/media
    networks:
      - wf_net
      - postiz_net
    depends_on:
      - waha
      - pgbouncer
    mem_limit: 1500m
    healthcheck:
      # /healthz does a real SELECT 1 — green == DB reachable (migrations ran).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3500/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------------------
  # waha — WhatsApp HTTP API (Plus). NOWEB engine, multi-session.
  #
  # IMAGE: devlikeapro/waha-plus requires the founder's WAHA Plus subscription
  #        ($19/mo) AND a `docker login` against the WAHA private registry/Docker
  #        Hub access granted with the sub. Core blocks multi-session (confirmed
  #        in Phase 0: HTTP 422 "WAHA Core support only 'default' session").
  #
  # TAG:   pinned to latest-2026.4.3 (current confirmed-stable build; WAHA tags
  #        are latest-{YEAR}.{MONTH}.{BUILD}). NEVER use the floating `latest`.
  #        To update: bump this tag deliberately, then `docker compose pull waha`.
  #
  # CORE FALLBACK (single-session only, for a smoke test without the sub):
  #   image: devlikeapro/waha:2026.5.1
  #   and set WAHA_SINGLE_SESSION=true on `app`. Core supports only the
  #   `default` session — not viable for multi-tenant production.
  # -------------------------------------------------------------------------
  waha:
    image: devlikeapro/waha-plus:latest-2026.4.3
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # API key the app sends as X-Api-Key. Set WAHA_API_KEY in .env.production;
      # WAHA reads it from WHATSAPP_API_KEY.
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # Persist NOWEB sessions across restarts.
      WAHA_NOWEB_STORE_ENABLED: "true"
      WHATSAPP_FILES_FOLDER: /app/.media
    volumes:
      - waha_data:/app/.sessions
    networks:
      - wf_net
    # NO ports: — WAHA is reachable only inside wf_net at http://waha:3000.
    mem_limit: 2500m

  # -------------------------------------------------------------------------
  # pgbouncer — connection pooler between the app and Postgres.
  #
  # WHY: Single direct pg.Pool (max=15) is fine for ONE app instance, but the
  # whole point of multi-instance horizontal scaling is broken without a pooler
  # — every replica opens its own 15-conn pool, and the upstream Postgres
  # max_connections ceiling is hit fast (current limit = 100; pg-backup + admin
  # also need headroom). PgBouncer holds a small upstream pool (default 20 here)
  # and lets thousands of client conns time-share it via transaction pooling.
  #
  # DELEGATED AUTH (auth_query mode): we DON'T keep a static SCRAM-hash file.
  # Each new client connection is validated by asking Postgres itself
  # (SELECT usename, passwd FROM pg_shadow WHERE usename=$1) using a known
  # auth_user. The password the client sends is ignored; PgBouncer swaps in the
  # real hashed password from the DB row when opening the upstream conn. This
  # means password rotation only needs the wf_user role updated — PgBouncer
  # sees the change on the next auth_query, no file re-bake required.
  #
  # USAGE: Switch app's DATABASE_URL from `postgresql://...@postgres:5432/...`
  # to `postgresql://wf_user:any@pgbouncer:6432/whatsapp_flow?pgbouncer=true`
  # and we're live. Verified via SQL: pool_size now = 20 instead of full client
  # fan-out hitting the DB.
  #
  # NO host port: app talks to pgbouncer over the docker network only.
  # -------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    environment:
      # edoburu parses these — same keys as ini, kebab-cased.
      # Listen on all interfaces inside the compose network; no host bind.
      PG_BOUNCER_LISTEN_ADDR: "0.0.0.0"
      PG_BOUNCER_LISTEN_PORT: "6432"
      # Delegated auth — clients authenticate via SCRAM hash file.
      PG_BOUNCER_AUTH_TYPE: "scram-sha-256"
      # Pool sizing — tight enough to stay under Postgres' 100 max_connections.
      PG_BOUNCER_POOL_MODE: "transaction"
      PG_BOUNCER_MAX_CLIENT_CONN: "4000"
      PG_BOUNCER_DEFAULT_POOL_SIZE: "20"
      PG_BOUNCER_RESERVE_POOL_SIZE: "5"
      PG_BOUNCER_RESERVE_POOL_TIMEOUT: "3"
      PG_BOUNCER_SERVER_IDLE_TIMEOUT: "600"
      PG_BOUNCER_QUERY_TIMEOUT: "30"
      PG_BOUNCER_STATS_PERIOD: "60"
      PG_BOUNCER_LOG_CONNECTIONS: "1"
      PG_BOUNCER_LOG_DISCONNECTIONS: "1"
      PG_BOUNCER_LOG_POOLER_ERRORS: "1"
      # Disable admin endpoints over TCP; we never need remote admin.
      PG_BOUNCER_ADMIN_USERS: ""
      PG_BOUNCER_STATS_USERS: ""
    networks:
      - wf_net
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------------
  # pg-backup — nightly logical dump of the whatsapp_flow database to a volume,
  # which restic then ships to R2. Replaces litestream (SQLite-only). Connects
  # to the shared postiz-postgres over postiz_net using DATABASE_URL.
  # -------------------------------------------------------------------------
  pg-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - pg_backup:/backup
    networks:
      - postiz_net
    mem_limit: 256m
    # Daily at 03:15: dump+gzip, then prune dumps older than 7 days.
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%dT%H%M%SZ)
          pg_dump "$$DATABASE_URL" | gzip > "/backup/whatsapp_flow_$$ts.sql.gz" \
            && echo "[pg-backup] wrote whatsapp_flow_$$ts.sql.gz" \
            || echo "[pg-backup] dump FAILED at $$ts"
          find /backup -name 'whatsapp_flow_*.sql.gz' -mtime +7 -delete
          sleep 86400
        done

  # -------------------------------------------------------------------------
  # restic-backup — periodic snapshot of media + WAHA sessions + pg dumps to R2.
  #
  # Postgres logical dumps (pg-backup volume), tenant media, and WAHA sessions
  # are snapshotted to R2. Runs an internal cron loop (default daily 03:30) and
  # exits only on error.
  #
  # Secrets live in .secrets/r2-token.env (chmod 600, git-ignored). The
  # `env_file` directive appends them to the container's environment; any
  # var defined in BOTH .env.production AND .secrets gets the .secrets value
  # because Docker Compose processes env_files in order (last wins).
  # -------------------------------------------------------------------------
  restic-backup:
    image: mazzolino/restic:1.8.2
    restart: unless-stopped
    env_file:
      - .env.production
      - .secrets/r2-token.env
    environment:
      BACKUP_CRON: "0 30 3 * * *"
      # Source paths (mounted read-only below): media, WAHA sessions, pg dumps.
      RESTIC_BACKUP_SOURCES: /data/media /data/waha /backup
      # Keep a rolling window; prune old snapshots after each run.
      RESTIC_FORGET_ARGS: --keep-daily 7 --keep-weekly 4 --prune
    volumes:
      - media_data:/data/media:ro
      - waha_data:/data/waha:ro
      - pg_backup:/backup:ro
    networks:
      - wf_net
    mem_limit: 256m

  # -------------------------------------------------------------------------
  # prometheus — metrics scraper for the whatsapp-flow stack.
  #
  # Loopback-only on 127.0.0.1:9095. Scrapes app's /metrics (port 3500) and
  # node-exporter (port 9100) every 15s. TSDB retention 15d. If grafana
  # needs raw PromQL access from the host, point it at this same port.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.listen-address=0.0.0.0:9090'
      # Conservative for a 2-core box.
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9095:9090"
    networks:
      - wf_net
    mem_limit: 512m
    depends_on:
      - app

  # -------------------------------------------------------------------------
  # grafana — dashboards. Auto-provisions a Prometheus datasource on first
  # start (see infrastructure/grafana/provisioning/) and loads all .json
  # dashboards from the dashboards volume.
  #
  # Anonymous admin disabled; we rely on the default admin user (admin/admin)
  # being changed via the Grafana UI on first login. Loopback-only.
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /dev/null  # Force UI-set admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3008:3000"
    networks:
      - wf_net
    mem_limit: 384m
    depends_on:
      - prometheus

  # -------------------------------------------------------------------------
  # node-exporter — host metrics (CPU/RAM/disk/net).
  #
  # pid=host, mount /proc /sys / read-only so it can read per-process stats.
  # On the same network so Prometheus can reach it as node-exporter:9100.
  # -------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - wf_net
    mem_limit: 64m

  # -------------------------------------------------------------------------
  # redis — Phase 2 cross-instance Pub/Sub transport.
  #
  # PURPOSE: when we scale the Hono app to 2+ replicas, in-process realtime
  # event broadcasting (whatsappflow_realtime_events_emitted_total) breaks:
  # instance A's WebSocket clients never see events emitted by instance B.
  # Fix is to publish events to a Redis channel; both instances subscribe on
  # `wf:realtime:*` and fan out to their own connected sockets.
  #
  # ALSO USED FOR: phase-5 distributed job-queue substrate (ZADD/ZPOPMIN on
  # a sorted-set). We keep both use cases in this single 7-alpine container
  # because the working set at launch is tiny (< 100 KB).
  #
  # ISOLATION: this is OUR Redis. The Hybrid repo has its own hybrid-redis
  # container on hybrid_default; that one lives on a separate docker network
  # and is intentionally NOT shared. We never depend on it (a reconnect, a
  # restart, or a deployment by a different agent cannot break us).
  #
  # SECURITY: no host port. Reachable only from inside wf_net at
  # `redis:6379`. Optional `requirepass` is left off for Phase 2 simplicity;
  # (TODO when exposing beyond the compose network).
  # -------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - 'redis-server'
      - '--maxmemory'
      - '128mb'
      - '--maxmemory-policy'
      - 'allkeys-lru'
      - '--save'
      - ''
      - '--appendonly'
      - 'no'
    volumes:
      - redis_data:/data
    networks:
      - wf_net
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
