  </defs>

  <!-- Background (optional, for app icons) -->

  <!-- Use the ecomex mark scaled to fit -->
  <g id="brand-mark-group" transform="translate(20, 30) scale(0.30)">
    <!-- Shadow layer (offset down for depth) -->
    <g transform="translate(0, 12)" opacity="0.35">
      <use href="#ecomex-mark" fill="#5b21b6"/>
    </g>

    <!-- Deep back ribbon (darker violet) -->
    <g class="ribbon-back">
      <use href="#ecomex-mark" fill="url(#deepShadow)"/>
    </g>

    <!-- Main icon fill -->
    <g class="ribbon-main">
      <use href="#ecomex-mark" fill="url(#violetGradient)" filter="url(#dropShadow)"/>
    </g>

    <!-- Inner highlight layer (creates the ribbon-fold light) -->
    <g class="ribbon-highlight" opacity="0.4">
      <use href="#ecomex-mark" fill="url(#highlight)"/>
    </g>

    <!-- Light reflection on top edge -->
    <g class="ribbon-shine" opacity="0.5">
      <use href="#ecomex-mark" fill="url(#violetLight)"/>
    </g>
  </g>

  <!-- Optional: glow accent for arrow tip (right-upper area) -->
  <circle class="arrow-accent" cx="148" cy="35" r="6" fill="#ffffff" opacity="0.7" filter="url(#arrowGlow)"/>
</svg>
