<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Landing-page theme bootstrap — runs before first paint to prevent a flash of
      the wrong theme on the marketing page (`.lp`). Resolves the saved choice
      (localStorage `lp-theme`) or the OS preference, then seeds `<html data-lp-theme>`
      + color-scheme. The React `useLpTheme` hook reads this seed on first render so
      the `.lp` root mounts already on the right theme. Independent of the app's
      next-themes (`.dark` class / `ecomex-theme`) system.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lp-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-lp-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-lp-theme", "dark");
        }
        // Density preference (compact / default / spacious) — applied before
        // first paint to avoid font-size reflow on hydration.
        try {
          var d = localStorage.getItem("ecomex-density");
          if (d !== "compact" && d !== "default" && d !== "spacious") d = "default";
          document.documentElement.setAttribute("data-density", d);
        } catch (e) {
          document.documentElement.setAttribute("data-density", "default");
        }
      })();
    </script>

    <!-- Fonts loaded NON-BLOCKING: preload as style, then swap to stylesheet on
         load so the font fetch never blocks first paint. display=swap keeps text
         visible meanwhile. One combined request:
           Inter (Latin UI + tabular numbers, app + landing),
           Hind Siliguri (dense Bengali APP UI — DESIGN_SYSTEM.md §2.1),
           Noto Serif Bengali (Bengali display, retained for the `.lp` landing scope only). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap"></noscript>
